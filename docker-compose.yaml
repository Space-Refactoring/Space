services:
  compiler:
      build:
        dockerfile: Docker/compile.Dockerfile
      platform: linux/amd64
      volumes:
        - .:/app
      command: bash -c 'LAZ_DIR=$$(dirname $$(find /usr/lib/lazarus -name lcl -type d | head -n 1)) && lazbuild --build-all --os=win32 --cpu=i386 --ws=win32 --lazarusdir=$$LAZ_DIR space.lpr Upgrade/upgrade.lpr Polizei/polizei.lpr CodeAg/CodeAg.lpr Auswertung/project1.lpr'

  runner:
    build:
      dockerfile: Docker/run.Dockerfile
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
