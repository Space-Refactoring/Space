services:
  compiler:
    build:
      dockerfile: Docker/compile.Dockerfile
    volumes:
      - .:/app
    command: >
      lazbuild
      --build-all
      --os=win32
      --cpu=i386
      --ws=win32
      --lazarusdir=/usr/lib/lazarus
      space.lpr

  runner:
    build:
      dockerfile: Docker/run.Dockerfile
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}